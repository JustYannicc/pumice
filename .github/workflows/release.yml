name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  determine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      package-exists: ${{ steps.package.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: mode
        uses: changesets/action/select-mode@v2.1.2
      - id: package
        name: Check whether the package exists on npm
        shell: bash
        run: |
          set -euo pipefail
          if result="$(npm view @justyannicc/pumice name --json 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if grep -q 'E404' <<<"$result"; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              printf '%s\n' "$result" >&2
              exit "$status"
            fi
          fi

  version:
    needs: [determine, verify]
    if: github.ref == 'refs/heads/main' && needs.determine.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2.1.2
        with:
          script: pnpm exec changeset version

  publish:
    needs: [determine, verify]
    if: github.ref == 'refs/heads/main' && needs.determine.outputs.mode == 'publish' && needs.determine.outputs.package-exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.6.2
      - id: version
        name: Check whether this version is already published
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if result="$(npm view "@justyannicc/pumice@${version}" version --json 2>&1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@justyannicc/pumice@${version} is already on npm; skipping publish."
          else
            status=$?
            if grep -q 'E404' <<<"$result"; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "@justyannicc/pumice@${version} is not on npm yet."
            else
              printf '%s\n' "$result" >&2
              exit "$status"
            fi
          fi
      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: pnpm run release
