name: CI

on:
  pull_request:
  workflow_call:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vp test run --maxWorkers=2
      - run: pnpm run typecheck
      - run: pnpm run typecheck:claude-release
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run check:package
